groups:
  - name: codebase-rag
    rules:
      - alert: RagApiHighErrorRate
        expr: sum(rate(rag_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(rag_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "RAG API 5xx rate exceeds 5%"}
      - alert: RagApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_http_request_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "RAG API p95 latency exceeds five seconds"}
      - alert: RagIndexQueueBacklog
        expr: rag_index_queue_depth > 20
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "RAG indexing queue is backed up"}
