name: Enterprise quality gates
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-sensitive-files.sh
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          version: "0.12.5"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest
      - run: uvx pip-audit
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.73.0"
          scan-type: fs
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
      - run: docker build --pull -t codebase-rag:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: "true"
        with:
          version: "v0.73.0"
          image-ref: "codebase-rag:${{ github.sha }}"
          scan-type: image
          scanners: vuln
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          timeout: 15m
