name: quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run pytest -q
      - run: uv run python -m compileall -q app tests scripts
      - run: docker compose config --quiet
