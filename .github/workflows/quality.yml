name: quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/check-sensitive-files.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.workflow }}-${{ github.job }}"
          version: "0.12.5"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m compileall -q app tests scripts
      - run: docker compose config --quiet
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: "${{ github.workflow }}-${{ github.job }}"
          version: "0.12.5"
      - run: uv lock --check
      - run: uv sync --locked
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - run: |
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:e2e -- --project=chromium
