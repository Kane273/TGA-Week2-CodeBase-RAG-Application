[project]
name = "engineering-codebase-rag"
version = "0.1.0"
description = "A fully local Engineering Codebase RAG Assistant built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb>=1.5.9,<2",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "sqlalchemy>=2.0,<3",
    "langchain>=0.3.27,<0.4",
    "langchain-chroma>=0.2.6,<0.3",
    "langchain-community>=0.3.27,<0.4",
    "langchain-ollama>=0.3.10,<0.4",
    "langgraph>=0.5,<0.7",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.31",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "rank-bm25==0.2.2",
    "sentence-transformers>=5.2,<6",
    "transformers>=5.2,<6",
    "tree-sitter-language-pack>=0.7,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-sdk>=1.29,<2",
    "uvicorn[standard]==0.34.0",
    "pinecone>=6,<8",
    "langsmith>=0.3.45,<1",
    "langgraph-checkpoint-postgres>=2,<4",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
